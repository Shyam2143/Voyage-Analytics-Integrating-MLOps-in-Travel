services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  flight-price-api:
    build: .
    image: flight-price-predictor:latest
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: flight-price-airflow:latest
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      FLIGHT_PRICE_DATASET_PATH: /opt/DATA/flights.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: flight-price-prediction
    volumes:
      - airflow-data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./artifacts:/opt/airflow/artifacts
      - ../DATA:/opt/DATA:ro
    restart: unless-stopped
    depends_on:
      - mlflow

volumes:
  airflow-data:
  mlflow-data:
